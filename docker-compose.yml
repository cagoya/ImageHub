version: '1.0'

services:
  # PostgreSQL 数据库服务
  postgres:
    image: postgres:latest
    container_name: imagehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: image_hub
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    networks:
      - imagehub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 服务
  redis:
    image: redis:latest
    container_name: imagehub-redis
    restart: unless-stopped
    command: redis-server --requirepass 123456
    ports:
      - "6379:6379"
    networks:
      - imagehub-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Qdrant 向量数据库服务
  qdrant:
    image: qdrant/qdrant:latest
    container_name: imagehub-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - imagehub-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MCP 服务
  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: imagehub-mcp
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "7777:7777"
    environment:
      - TZ=Asia/Shanghai
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6334
    networks:
      - imagehub-network

  # 后端服务
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: imagehub-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "8888:8888"
    volumes:
      - ./server/public:/app/public
      - ./server/log:/app/log
    environment:
      - TZ=Asia/Shanghai
      - CONFIG_FILE=docker.yaml
    networks:
      - imagehub-network

  # 前端服务 (Nginx)
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: imagehub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - imagehub-network

networks:
  imagehub-network:
    driver: bridge

volumes:
  qdrant_data:
    driver: local