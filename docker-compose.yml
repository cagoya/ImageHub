version: '1.0'

services:
  # PostgreSQL 数据库服务
  postgres:
    image: postgres:latest
    container_name: imagehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: image_hub
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    networks:
      - imagehub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 服务
  redis:
    image: redis:latest
    container_name: imagehub-redis
    restart: unless-stopped
    command: redis-server --requirepass 123456
    ports:
      - "6379:6379"
    networks:
      - imagehub-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 后端服务
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: imagehub-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8888:8888"
    volumes:
      - ./server/public:/app/public
      - ./server/log:/app/log
    environment:
      - TZ=Asia/Shanghai
      - CONFIG_FILE=docker.yaml
    networks:
      - imagehub-network

  # 前端服务
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: imagehub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    networks:
      - imagehub-network

networks:
  imagehub-network:
    driver: bridge