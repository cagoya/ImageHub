version: '1.0'

services:
  # PostgreSQL 数据库服务
  postgres:
    image: postgres:latest
    container_name: imagehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: image_hub
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    networks:
      - imagehub-network

  # Redis 服务
  redis:
    image: redis:latest
    container_name: imagehub-redis
    restart: unless-stopped
    command: redis-server --requirepass 123456 --notify-keyspace-events Ex
    ports:
      - "6379:6379"
    networks:
      - imagehub-network

  # Qdrant 向量数据库服务
  qdrant:
    image: qdrant/qdrant:latest
    container_name: imagehub-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    networks:
      - imagehub-network

  # MCP 服务
  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: imagehub-mcp
    restart: unless-stopped
    depends_on:
      - qdrant
    ports:
      - "7777:7777"
    environment:
      - TZ=Asia/Shanghai
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6334
    networks:
      - imagehub-network

  # 后端服务
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: imagehub-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - qdrant
    ports:
      - "8888:8888"
    volumes:
      - ./server/public:/app/public
      - ./server/log:/app/log
    environment:
      - TZ=Asia/Shanghai
      - CONFIG_FILE=docker.yaml
    networks:
      - imagehub-network

  # 前端服务 (Nginx)
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      # 生产环境推荐：不设置 args，使用相对路径 /api（通过 Nginx 代理到后端）
    container_name: imagehub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - imagehub-network

networks:
  imagehub-network:
    driver: bridge