name: ImageHub CI

on: [push, pull_request]

jobs:
  server-ci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-go@v4
      with:
        go-version: '1.24'
        
    - name: Install and configure MySQL
      run: |
        sudo apt-get update
        sudo apt-get install -y mysql-server mysql-client
        sudo systemctl start mysql
        sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED BY '123456';"
        sudo mysql -e "FLUSH PRIVILEGES;" -p123456
        sudo mysql -u root -p123456 -e "CREATE DATABASE IF NOT EXISTS image_hub;"

    - name: Download Go dependencies
      working-directory: ./server
      run: |
        echo "Downloading Go dependencies..."
        go mod download
        echo "Dependencies downloaded successfully!"

    - name: Verify dependencies
      working-directory: ./server
      run: |
        echo "Verifying dependencies..."
        go mod verify
        echo "Tidying go.mod..."
        go mod tidy
  
    - name: Build
      working-directory: ./server
      run: go build -o main main.go
      
    - name: Format Check
      working-directory: ./server
      run: |
        gofmt -l . | grep -e ".go" && exit 1 || exit 0
        go install golang.org/x/tools/cmd/goimports@latest
        goimports -l . | grep -e ".go" && exit 1 || exit 0
        
    - name: Test
      working-directory: ./server/test
      env:
        DB_PASSWORD: 123456
      run: go test -v -race ./...