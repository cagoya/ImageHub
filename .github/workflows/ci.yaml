name: ImageHub CI

on: [push, pull_request]

jobs:
  server-ci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-go@v4
      with:
        go-version: '1.24'
        
    - name: Install and configure MySQL
      run: |
        docker pull mysql
        docker run -d \
        --name mysql-server \
        -p 3306:3306 \
        -e MYSQL_ROOT_PASSWORD="123456" \
        mysql
        docker ps
    
    - name: Install and configure Redis
      run: |
        docker pull redis
        docker run -d \
        --name redis-server \
        -p 6379:6379 \
        -e REDIS_PASSWORD="123456" \
        redis
        docker ps

    - name: Download Go dependencies
      working-directory: ./server
      run: |
        echo "Downloading Go dependencies..."
        go mod download
        echo "Dependencies downloaded successfully!"

    - name: Verify dependencies
      working-directory: ./server
      run: |
        echo "Verifying dependencies..."
        go mod verify
        echo "Tidying go.mod..."
        go mod tidy
  
    - name: Build
      working-directory: ./server
      run: go build -o main main.go
      
    - name: Format Check
      working-directory: ./server
      run: |
        gofmt -l . | grep -e ".go" && exit 1 || exit 0
        go install golang.org/x/tools/cmd/goimports@latest
        goimports -l . | grep -e ".go" && exit 1 || exit 0
        
    - name: Test with coverage
      working-directory: ./server
      run: |
        go test -coverpkg=./model,./service -v -cover -coverprofile=coverage.out ./test/...
      
    - name: Generate HTML report
      working-directory: ./server
      run: |
        go tool cover -html=coverage.out -o coverage.html
        
      # 保存原始覆盖率数据
    - name: Upload coverage data
      uses: actions/upload-artifact@v4
      with:
        name: coverage-data
        path: |
          server/coverage.out
          server/coverage.html
        retention-days: 30

  build-docker-images:
    runs-on: ubuntu-latest
    needs: server-ci
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build server image
      uses: docker/build-push-action@v5
      with:
        context: ./server
        file: ./server/Dockerfile
        push: false
        tags: imagehub-server:latest
    
    - name: Build web image
      uses: docker/build-push-action@v5
      with:
        context: ./web
        file: ./web/Dockerfile
        push: false
        tags: imagehub-web:latest
    
    - name: Save Docker images
      run: |
        docker save imagehub-server:latest -o server-image.tar
        docker save imagehub-web:latest -o web-image.tar
    
    - name: Upload Docker images
      uses: actions/upload-artifact@v4
      with:
        name: docker-images
        path: |
          server-image.tar
          web-image.tar
        retention-days: 7