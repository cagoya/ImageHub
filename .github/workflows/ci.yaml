name: ImageHub CI

on: [push, pull_request]

jobs:
  server-ci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-go@v4
      with:
        go-version: '1.24'
        
    - name: Install and configure PostgreSQL
      run: |
        docker pull postgres
        docker run -d \
        --name postgres-server \
        -p 5432:5432 \
        -e POSTGRES_USER=postgres \
        -e POSTGRES_PASSWORD=123456 \
        -e POSTGRES_DB=image_hub \
        postgres
        docker ps
    
    - name: Create test database
      run: |
        docker exec -it postgres-server psql -U postgres -c "CREATE DATABASE image_hub_test;"
    
    - name: Install and configure Redis
      run: |
        docker pull redis
        docker run -d \
        --name redis-server \
        -p 6379:6379 \
        -e REDIS_PASSWORD="123456" \
        redis
        docker ps
    
    - name: Install and configure Qdrant
      run: |
        docker pull qdrant/qdrant
        docker run -d \
        --name qdrant-server \
        -p 6334:6334 \
        qdrant/qdrant
        docker ps

    - name: Download Go dependencies
      working-directory: ./server
      run: |
        echo "Downloading Go dependencies..."
        go mod download
        echo "Dependencies downloaded successfully!"

    - name: Verify dependencies
      working-directory: ./server
      run: |
        echo "Verifying dependencies..."
        go mod verify
        echo "Tidying go.mod..."
        go mod tidy
  
    - name: Build
      working-directory: ./server
      run: go build -o main main.go
      
    - name: Format Check
      working-directory: ./server
      run: |
        gofmt -l . | grep -e ".go" && exit 1 || exit 0
        go install golang.org/x/tools/cmd/goimports@latest
        goimports -l . | grep -e ".go" && exit 1 || exit 0