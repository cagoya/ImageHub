server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    
    # 全局文件上传大小限制（在 location 中也可以单独设置）
    client_max_body_size 20m;

    # 启用 gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # API 代理到后端服务
    location /api {
        proxy_pass http://backend:8888;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 文件上传配置
        client_max_body_size 20m;  # 允许上传最大 20MB 的文件（与前端限制一致）
        proxy_read_timeout 300s;    # 读取后端响应的超时时间（5分钟）
        proxy_connect_timeout 60s;  # 连接后端的超时时间
        proxy_send_timeout 300s;    # 发送请求到后端的超时时间（5分钟）
    }

    # 静态文件代理到后端服务（图片文件）
    # 使用 ^~ 修饰符确保优先匹配，不会被后续的正则匹配覆盖
    location ^~ /public {
        proxy_pass http://backend:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 图片文件缓存配置
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 静态资源缓存（前端构建的静态资源）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由支持 - 所有路由都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

